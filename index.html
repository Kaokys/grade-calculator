<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณ GPA และ GPAX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1f1f1f;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(212, 175, 55, 0.1);
            padding: 40px;
            border: 1px solid #333;
        }
        
        h1 {
            text-align: center;
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }
        
        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }
        
        .semester-section {
            background: #2a2a2a;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #3a3a3a;
        }
        
        .semester-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .semester-title {
            font-size: 1.3em;
            color: #d4af37;
            font-weight: bold;
        }
        
        .subject-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .subject-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            align-items: center;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }
        
        input, select {
            padding: 10px;
            border: 2px solid #3a3a3a;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
            background: #2a2a2a;
            color: #e0e0e0;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn-add {
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            color: #1a1a1a;
            margin-top: 15px;
        }
        
        .btn-add:hover {
            background: linear-gradient(135deg, #f4d03f 0%, #d4af37 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        
        .btn-remove {
            background: #8b0000;
            color: white;
            padding: 8px 15px;
        }
        
        .btn-remove:hover {
            background: #a00000;
        }
        
        .btn-semester {
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            color: #1a1a1a;
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            margin-top: 20px;
        }
        
        .btn-semester:hover {
            background: linear-gradient(135deg, #f4d03f 0%, #d4af37 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .result-card {
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            color: #1a1a1a;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        
        .result-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .result-value {
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .grade-scale {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border: 2px solid #3a3a3a;
        }
        
        .grade-scale h3 {
            color: #d4af37;
            margin-bottom: 15px;
        }
        
        .grade-table {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }
        
        .grade-item {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 คำนวณ GPA และ GPAX</h1>
        <p class="subtitle">ระบบคำนวณเกรดเฉลี่ยตามระบบการศึกษาไทย</p>
        
        <div id="semesters"></div>
        
        <button class="btn btn-semester" onclick="addSemester()">➕ เพิ่มเทอม</button>
        
        <div class="results">
            <div class="result-card">
                <div class="result-label">GPAX รวมทุกเทอม</div>
                <div class="result-value" id="gpax">0.00</div>
            </div>
        </div>
        
        <div class="grade-scale">
            <h3>📊 ตารางเกรด</h3>
            <div class="grade-table">
                <div class="grade-item"><strong>4.0</strong><br>A</div>
                <div class="grade-item"><strong>3.5</strong><br>B+</div>
                <div class="grade-item"><strong>3.0</strong><br>B</div>
                <div class="grade-item"><strong>2.5</strong><br>C+</div>
                <div class="grade-item"><strong>2.0</strong><br>C</div>
                <div class="grade-item"><strong>1.5</strong><br>D+</div>
                <div class="grade-item"><strong>1.0</strong><br>D</div>
                <div class="grade-item"><strong>0.0</strong><br>F</div>
            </div>
        </div>
    </div>

    <script>
        let semesters = [];
        let semesterCount = 0;

        function addSemester() {
            semesterCount++;
            const semester = {
                id: semesterCount,
                subjects: [{ id: 1 }]
            };
            semesters.push(semester);
            renderSemesters();
        }

        function saveData() {
            semesters.forEach(semester => {
                semester.subjects.forEach(subject => {
                    const nameInput = document.getElementById(`name-${semester.id}-${subject.id}`);
                    const creditInput = document.getElementById(`credit-${semester.id}-${subject.id}`);
                    const gradeSelect = document.getElementById(`grade-${semester.id}-${subject.id}`);
                    
                    if (nameInput) subject.name = nameInput.value;
                    if (creditInput) subject.credit = creditInput.value;
                    if (gradeSelect) subject.grade = gradeSelect.value;
                });
            });
        }

        function addSubject(semesterId) {
            saveData();
            const semester = semesters.find(s => s.id === semesterId);
            const newId = semester.subjects.length > 0 ? 
                Math.max(...semester.subjects.map(s => s.id)) + 1 : 1;
            semester.subjects.push({ id: newId, name: '', credit: '', grade: '' });
            renderSemesters();
        }

        function removeSubject(semesterId, subjectId) {
            saveData();
            const semester = semesters.find(s => s.id === semesterId);
            semester.subjects = semester.subjects.filter(s => s.id !== subjectId);
            if (semester.subjects.length === 0) {
                semester.subjects.push({ id: 1, name: '', credit: '', grade: '' });
            }
            renderSemesters();
            calculateAll();
        }

        function removeSemester(semesterId) {
            saveData();
            semesters = semesters.filter(s => s.id !== semesterId);
            renderSemesters();
            calculateAll();
        }

        function renderSemesters() {
            const container = document.getElementById('semesters');
            container.innerHTML = '';

            semesters.forEach(semester => {
                const semesterDiv = document.createElement('div');
                semesterDiv.className = 'semester-section';
                
                let subjectsHTML = '';
                semester.subjects.forEach(subject => {
                    subjectsHTML += `
                        <div class="subject-row">
                            <input type="text" placeholder="ชื่อวิชา" 
                                onchange="calculateAll()">
                            <input type="number" placeholder="หน่วยกิต" min="0" step="0.5" 
                                id="credit-${semester.id}-${subject.id}" 
                                onchange="calculateAll()">
                            <select id="grade-${semester.id}-${subject.id}" 
                                onchange="calculateAll()">
                                <option value="">เลือกเกรด</option>
                                <option value="4.0">A (4.0)</option>
                                <option value="3.5">B+ (3.5)</option>
                                <option value="3.0">B (3.0)</option>
                                <option value="2.5">C+ (2.5)</option>
                                <option value="2.0">C (2.0)</option>
                                <option value="1.5">D+ (1.5)</option>
                                <option value="1.0">D (1.0)</option>
                                <option value="0.0">F (0.0)</option>
                            </select>
                            <button class="btn btn-remove" 
                                onclick="removeSubject(${semester.id}, ${subject.id})">
                                🗑️
                            </button>
                        </div>
                    `;
                });

                semesterDiv.innerHTML = `
                    <div class="semester-header">
                        <div class="semester-title">📚 เทอมที่ ${semester.id}</div>
                        <div>
                            <span style="font-size: 1.1em; margin-right: 15px; color: #e0e0e0;">
                                GPA: <strong style="color: #d4af37;" id="gpa-${semester.id}">0.00</strong>
                            </span>
                            <button class="btn btn-remove" onclick="removeSemester(${semester.id})">
                                ลบเทอม
                            </button>
                        </div>
                    </div>
                    <div class="subject-list">
                        ${subjectsHTML}
                    </div>
                    <button class="btn btn-add" onclick="addSubject(${semester.id})">
                        ➕ เพิ่มวิชา
                    </button>
                `;
                
                container.appendChild(semesterDiv);
            });
        }

        function calculateAll() {
            let totalPoints = 0;
            let totalCredits = 0;

            semesters.forEach(semester => {
                let semesterPoints = 0;
                let semesterCredits = 0;

                semester.subjects.forEach(subject => {
                    const creditInput = document.getElementById(`credit-${semester.id}-${subject.id}`);
                    const gradeSelect = document.getElementById(`grade-${semester.id}-${subject.id}`);

                    if (creditInput && gradeSelect && creditInput.value && gradeSelect.value) {
                        const credit = parseFloat(creditInput.value);
                        const grade = parseFloat(gradeSelect.value);
                        
                        semesterPoints += credit * grade;
                        semesterCredits += credit;
                    }
                });

                const gpa = semesterCredits > 0 ? (semesterPoints / semesterCredits).toFixed(2) : '0.00';
                const gpaElement = document.getElementById(`gpa-${semester.id}`);
                if (gpaElement) {
                    gpaElement.textContent = gpa;
                }

                totalPoints += semesterPoints;
                totalCredits += semesterCredits;
            });

            const gpax = totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : '0.00';
            document.getElementById('gpax').textContent = gpax;
        }

        // เริ่มต้นด้วย 1 เทอม
        addSemester();
    </script>
</body>
</html>
